<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>diorama — demos</title>
  <style>
    :root {
      --bg: #f8f8f8;
      --surface: #ffffff;
      --border: #e4e4e7;
      --border-subtle: #ebebed;
      --text: #1a1a1e;
      --text-dim: #6b6b76;
      --text-muted: #9c9ca6;
      --accent: #6b6b76;
      --green: #16a34a;
      --red: #dc2626;
      --yellow: #b45309;
      --cyan: #0891b2;
      --purple: #7c3aed;

      --mono: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────────────── */
    .site-header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 2rem 0;
      display: flex;
      align-items: baseline;
      gap: 1.25rem;
    }

    .site-header h1 {
      font-family: var(--mono);
      font-size: .95rem;
      font-weight: 400;
      color: var(--text);
      letter-spacing: -.01em;
    }

    .site-header h1 span {
      color: var(--text-muted);
    }

    .site-header nav {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--text-muted);
      display: flex;
      gap: .75rem;
    }

    .site-header nav a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color .15s;
    }
    .site-header nav a:hover { color: var(--text); }

    .header-sep {
      flex: 1;
    }

    .header-status {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .header-status .indicator {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .header-status .indicator.active {
      background: var(--green);
      box-shadow: 0 0 6px rgba(22, 163, 74, .3);
    }

    /* ── Desc ─────────────────────────── */
    .site-desc {
      max-width: 1100px;
      margin: 0 auto;
      padding: .75rem 2rem 0;
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .divider {
      max-width: 1100px;
      margin: 1.5rem auto 0;
      padding: 0 2rem;
    }

    .divider hr {
      border: 0;
      height: 1px;
      background: var(--border);
    }

    /* ── Status bar ───────────────────── */
    .status-bar {
      display: flex;
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: .75rem 2rem;
      flex-wrap: wrap;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--text-muted);
    }

    .status-item .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    /* ── Grid ─────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 2rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem 2.5rem;
    }

    /* ── Project item ────────────────── */
    .project-item {
      display: flex;
      flex-direction: column;
      gap: .35rem;
    }

    .project-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
    }

    .project-title {
      font-family: var(--mono);
      font-size: .75rem;
      font-weight: 500;
      color: var(--text-dim);
    }

    .project-badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tier-badge {
      font-family: var(--mono);
      font-size: .58rem;
      font-weight: 400;
      padding: .1rem .4rem;
      border-radius: 2px;
      letter-spacing: .04em;
      text-transform: lowercase;
      flex-shrink: 0;
      border: 1px solid var(--border);
      color: var(--text-dim);
      background: transparent;
    }

    .tier-badge.static { color: var(--green); border-color: rgba(74,222,128,.2); }
    .tier-badge.esm    { color: var(--cyan);  border-color: rgba(34,211,238,.2); }
    .tier-badge.jsx    { color: var(--yellow); border-color: rgba(251,191,36,.2); }
    .tier-badge.vite   { color: var(--purple); border-color: rgba(167,139,250,.2); }

    .frame-badge {
      font-family: var(--mono);
      font-size: .58rem;
      font-weight: 400;
      padding: .1rem .4rem;
      border-radius: 2px;
      letter-spacing: .04em;
      flex-shrink: 0;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: transparent;
    }

    .project-link {
      font-family: var(--mono);
      font-size: .62rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color .15s;
    }
    .project-link:hover { color: var(--text); }

    .project-preview {
      min-height: 280px;
    }

    /* ── Console ──────────────────────── */
    .console-wrap {
      max-width: 1100px;
      margin: 0 auto 2rem;
      padding: 0 2rem;
    }

    .console-panel {
      background: var(--surface);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .console-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: .45rem .75rem;
      border-bottom: 1px solid var(--border);
    }

    .console-header span {
      font-family: var(--mono);
      font-size: .65rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .console-body {
      padding: .5rem .75rem;
      max-height: 180px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: .66rem;
      line-height: 1.8;
    }

    .console-body::-webkit-scrollbar { width: 4px; }
    .console-body::-webkit-scrollbar-track { background: transparent; }
    .console-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .console-body .log      { color: var(--text-muted); }
    .console-body .log.success { color: var(--green); }
    .console-body .log.error   { color: var(--red); }
    .console-body .log .timestamp { color: var(--text-muted); opacity: .5; margin-right: .4rem; }

    /* ── Footer ───────────────────────── */
    footer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.2rem 2rem;
      font-family: var(--mono);
      font-size: .65rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    footer a {
      color: var(--text-dim);
      text-decoration: none;
    }
    footer a:hover { color: var(--text); }

    /* ── Responsive ───────────────────── */
    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
        padding: .5rem 1rem 2rem;
      }
      .site-header { padding: 1.5rem 1rem 0; flex-wrap: wrap; }
      .site-desc { padding: .5rem 1rem 0; }
      .divider { padding: 0 1rem; }
      .status-bar { padding: .5rem 1rem; }
      .console-wrap { padding: 0 1rem; }
      footer { padding: .75rem 1rem; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="site-header">
    <h1>diorama <span>/ demos</span></h1>
    <nav>
      <a href="https://github.com/becca/diorama">source</a>
      <a href="./docs.html">docs</a>
    </nav>
    <div class="header-sep"></div>
    <div class="header-status" id="header-status">
      <span class="indicator"></span>
      <span>idle</span>
    </div>
  </div>

  <div class="site-desc">
    GitHub projects rendered client-side in sandboxed iframes. No server, no build step for the host page &mdash; just fetch, transform, display.
  </div>

  <div class="divider"><hr></div>

  <div class="status-bar" id="status-bar"></div>

  <div class="grid" id="project-grid"></div>

  <div class="console-wrap">
    <div class="console-panel">
      <div class="console-header">
        <span>log</span>
      </div>
      <div class="console-body" id="console-body"></div>
    </div>
  </div>

  <footer>
    <a href="https://github.com/becca/diorama">diorama</a> &middot; open source &middot; zero backend
  </footer>

  <script type="module" src="./main.ts"></script>
</body>
</html>
